name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate drop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run drop checks
        run: bash scripts/validate.sh

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    # Validate on PRs, but only deploy on pushes to main / manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (exclude repo plumbing)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='.github' --exclude='scripts' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
